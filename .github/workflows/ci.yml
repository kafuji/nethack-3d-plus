name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Upstream's lockfile is not always in sync with package.json, so `npm ci`
      # can fail; match the Pages deploy workflow and use `npm i`.
      - name: Install dependencies
        run: npm i --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npm run check:tsc

      - name: Unit tests
        run: npx vitest run

      - name: Translation check
        run: npm run i18n:check

      - name: Startup ruleset check
        run: npm run startup:check-rulesets
